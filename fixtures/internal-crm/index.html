<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acme Internal CRM</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #1a1a2e; }
      body { margin: 0; background: #f4f5fb; }
      header { background: #2b2d6e; color: #fff; padding: 16px 28px; font-weight: 600; }
      main { max-width: 720px; margin: 32px auto; padding: 0 20px; }
      .card { background: #fff; border: 1px solid #e2e3ef; border-radius: 10px; padding: 22px; margin-bottom: 22px; }
      label { display: block; font-size: 13px; color: #555; margin: 12px 0 4px; }
      input, select { width: 100%; padding: 9px 11px; border: 1px solid #cfd0dd; border-radius: 7px; font-size: 14px; box-sizing: border-box; }
      button { margin-top: 16px; background: #2b2d6e; color: #fff; border: 0; border-radius: 7px; padding: 10px 18px; font-size: 14px; cursor: pointer; }
      table { width: 100%; border-collapse: collapse; margin-top: 8px; }
      th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid #eef0f7; font-size: 14px; }
      th { color: #888; font-weight: 600; font-size: 12px; text-transform: uppercase; }
      .error { color: #c0392b; font-size: 13px; margin-top: 12px; min-height: 16px; }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <header>Acme Internal CRM</header>
    <main>
      <section id="login" class="card">
        <h1>Sign in</h1>
        <label for="username">Username</label>
        <input id="username" data-test="username" placeholder="Username" autocomplete="off" />
        <label for="password">Password</label>
        <input id="password" data-test="password" type="password" placeholder="Password" autocomplete="off" />
        <button data-test="signin" id="signin">Sign in</button>
        <div class="error" id="login-error"></div>
      </section>

      <section id="app" class="hidden">
        <div class="card">
          <h2>New ticket</h2>
          <label for="subject">Subject</label>
          <input id="subject" data-test="subject" placeholder="Subject" autocomplete="off" />
          <label for="priority">Priority</label>
          <select id="priority" data-test="priority">
            <option>Low</option>
            <option selected>Medium</option>
            <option>High</option>
          </select>
          <button data-test="create" id="create">Create ticket</button>
        </div>
        <div class="card">
          <h2>Tickets</h2>
          <table data-test="tickets">
            <thead><tr><th>Subject</th><th>Priority</th></tr></thead>
            <tbody id="tickets"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script>
      const VALID = { username: "ops", password: "ops-secret" };

      function addTicket(subject, priority) {
        const row = document.createElement("tr");
        row.className = "ticket";
        const s = document.createElement("td");
        s.className = "subject";
        s.textContent = subject;
        const p = document.createElement("td");
        p.className = "priority";
        p.textContent = priority;
        row.append(s, p);
        const body = document.getElementById("tickets");
        body.insertBefore(row, body.firstChild);
      }

      addTicket("Onboard new adjuster account", "Low");

      document.getElementById("signin").addEventListener("click", () => {
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        if (username === VALID.username && password === VALID.password) {
          document.getElementById("login").classList.add("hidden");
          document.getElementById("app").classList.remove("hidden");
        } else {
          document.getElementById("login-error").textContent = "Invalid credentials.";
        }
      });

      document.getElementById("create").addEventListener("click", () => {
        const subject = document.getElementById("subject").value.trim();
        if (!subject) return;
        const priority = document.getElementById("priority").value;
        addTicket(subject, priority);
        document.getElementById("subject").value = "";
      });
    </script>
  </body>
</html>
